kind = "web"
previewPath = "/"
title = "怎么用好AI · 选题库"
description = "公开的 AI 选题与外部成果展示网站，支持固定来源同步、成果回传和站主内容维护，不承担制作与平台发布过程。"
version = "1.0.0"
id = "artifacts/ai-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22936

[services.development]
run = "pnpm --filter @workspace/ai-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22936"
BASE_PATH = "/"
