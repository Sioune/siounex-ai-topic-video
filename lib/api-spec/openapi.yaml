openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /public/topics:
    get:
      operationId: listPublicTopics
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Public source topics only; no personal information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicPage" }
  /public/results:
    get:
      operationId: listPublicResults
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: kind, in: query, schema: { type: string, enum: [article, video, link] } }
      responses:
        "200":
          description: Owner-approved external results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContentResult" } }
  /public/results/{id}:
    get:
      operationId: getPublicResult
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Visible result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentResult" }
        "404": { description: Not visible or not found }
  /admin/content:
    get:
      operationId: getContentAdmin
      responses:
        "200":
          description: Owner-only content and sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentAdmin" }
  /admin/results:
    post:
      operationId: saveContentResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentResultInput" }
      responses:
        "200":
          description: Saved privately; identical imports are idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentResult" }
  /admin/results/{id}/visibility:
    post:
      operationId: setResultVisibility
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultVisibilityInput" }
      responses:
        "200":
          description: Visibility updated without invoking production or platform publishing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentResult" }
  /admin/results/{id}:
    delete:
      operationId: deleteContentResult
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed from display catalog; original external files are untouched }
  /admin/sources/refresh:
    post:
      operationId: refreshContentSources
      responses:
        "200":
          description: Fixed allowlist refreshed; per-source status is available in the admin overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionMessage" }
  /admin/sync-key:
    post:
      operationId: issueResultSyncKey
      responses:
        "201":
          description: New import-only key; previous key invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultSyncKey" }
    delete:
      operationId: revokeResultSyncKey
      responses:
        "204": { description: Import key revoked }
  /sync/results:
    post:
      operationId: importExternalResult
      security:
        - resultSyncKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentResultInput" }
      responses:
        "200":
          description: Imported privately; this credential cannot make results public
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    resultSyncKey:
      type: http
      scheme: bearer
  schemas:
    PublicTopic:
      type: object
      required: [id, title, summary, url, source, category, published_at]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        url: { type: string }
        source: { type: string }
        category: { type: string }
        published_at: { type: string }
    TopicPage:
      type: object
      required: [topics, total, page, page_size, categories, last_synced_at]
      properties:
        topics: { type: array, items: { $ref: "#/components/schemas/PublicTopic" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        categories: { type: array, items: { type: string } }
        last_synced_at: { type: ["string", "null"] }
    ContentResult:
      type: object
      required: [id, external_id, revision, kind, title, summary, body, source_url, content_url, cover_url, visible, updated_at]
      properties:
        id: { type: string }
        external_id: { type: string }
        revision: { type: integer }
        kind: { type: string, enum: [article, video, link] }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        source_url: { type: string }
        content_url: { type: string }
        cover_url: { type: string }
        visible: { type: boolean }
        updated_at: { type: string }
    ContentResultInput:
      type: object
      additionalProperties: false
      required: [external_id, revision, kind, title, summary, body, source_url, content_url, cover_url]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 120 }
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [article, video, link] }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, maxLength: 2000 }
        body: { type: string, maxLength: 100000 }
        source_url: { type: string, maxLength: 2000 }
        content_url: { type: string, maxLength: 2000 }
        cover_url: { type: string, maxLength: 2000 }
    ResultVisibilityInput:
      type: object
      additionalProperties: false
      required: [visible, revision]
      properties:
        visible: { type: boolean }
        revision: { type: integer, minimum: 1 }
    SourceSyncStatus:
      type: object
      required: [id, name, state, message, last_attempt, last_success]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
        message: { type: string }
        last_attempt: { type: ["string", "null"] }
        last_success: { type: ["string", "null"] }
    ContentAdmin:
      type: object
      required: [results, sources, sync_key_active, topic_count, legacy_job_count, refresh_running, automatic_refresh_minutes]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ContentResult" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceSyncStatus" } }
        sync_key_active: { type: boolean }
        topic_count: { type: integer }
        legacy_job_count: { type: integer }
        refresh_running: { type: boolean }
        automatic_refresh_minutes: { type: integer }
    ResultSyncKey:
      type: object
      required: [token, endpoint]
      properties:
        token: { type: string }
        endpoint: { type: string }
    ActionMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

